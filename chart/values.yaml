replicaCount: 2

image:
  repository: demo-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appName: enterprise-bot-demo
  version: "1.0.0"

ingress:
  enabled: true
  className: nginx
  host: demo.local

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
