name: Enterprise Bot lab diagnostics
on:
  push:
    branches: [enterprise-bot-devops-eval]
    paths:
      - ".github/workflows/eb-diagnostic.yml"
      - "lab/broken-chart/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: debug-eval
      - name: Run lab and investigate failing probes
        run: |
          set +e
          kubectl create namespace debug-lab
          cd lab
          ./scenario.sh up
          sleep 12
          echo "=== K8S SERVICES ==="
          kubectl -n debug-lab get pods,svc,endpoints,rolebinding,sa -o wide
          echo "=== REPORTER DESCRIBE ==="
          kubectl -n debug-lab describe pod -l app=reporter
          echo "=== REPORTER LOGS ==="
          kubectl -n debug-lab logs deploy/reporter --tail=70
          echo "=== BUSYBOX LONG RUNNING PROBE ==="
          kubectl -n debug-lab run manual-probe --restart=Never --image=busybox:1.36 --command -- sleep 300
          kubectl -n debug-lab wait pod/manual-probe --for=condition=Ready --timeout=75s
          kubectl -n debug-lab exec manual-probe -- sh -c 'echo DNS; nslookup backend; echo BACKEND; wget -S -O- -T 5 http://backend:8080/healthz; echo GATEWAY; wget -S -O- -T 5 http://gateway.debug-lab.svc/status; echo REPORTER; wget -S -O- -T 5 http://reporter:8080/report'
          echo "=== SHORT LIVED KUBECTL RUN ATTACH ==="
          kubectl -n debug-lab run short-probe --rm -i --restart=Never --image=busybox:1.36 --quiet --pod-running-timeout=60s --command -- sh -c 'echo TEST_ATTACH_OUTPUT; nslookup backend; wget -q -O- -T 4 http://backend:8080/healthz'
          echo "=== RUN ORIGINAL VERIFY ==="
          ./scenario.sh verify
          echo "=== TRACE EXACT ORIGINAL VERIFY (stderr trace, includes captured stdout) ==="
          bash -x ./scenario.sh verify 2>&1 | tail -130
          echo "=== MANUAL API SERVER REQUEST WITH REPORTER SERVICEACCOUNT ==="
          kubectl -n debug-lab run api-probe --restart=Never --overrides='{"spec":{"serviceAccountName":"reporter"}}' --image=busybox:1.36 --command -- sleep 180
          kubectl -n debug-lab wait pod/api-probe --for=condition=Ready --timeout=60s
          kubectl -n debug-lab exec api-probe -- sh -c 'echo token_size; wc -c < /var/run/secrets/kubernetes.io/serviceaccount/token; echo kubeapi; TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token); wget -S -O /tmp/pods.json -T 5 --no-check-certificate --header="Authorization: Bearer $TOKEN" https://kubernetes.default.svc/api/v1/namespaces/debug-lab/pods; echo wget_exit=$?; ls -l /tmp/pods.json; head -c 320 /tmp/pods.json; echo'
          echo "=== KUBERNETES API ENDPOINTS ==="
          kubectl -n default get svc,endpoints kubernetes -o wide
          echo "=== CURL CLIENT WITH REPORTER SERVICE ACCOUNT ==="
          kubectl -n debug-lab run curl-probe --restart=Never --overrides='{"spec":{"serviceAccountName":"reporter"}}' --image=curlimages/curl:8.17.0 --command -- sleep 180
          kubectl -n debug-lab wait pod/curl-probe --for=condition=Ready --timeout=60s
          kubectl -n debug-lab exec curl-probe -- sh -c 'echo service_tls; curl -kvsI --connect-timeout 5 https://kubernetes.default.svc/ 2>&1 | tail -32; echo service_auth; T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token); curl -sk --connect-timeout 5 -o /tmp/pods.json -w "STATUS=%{http_code}\\n" -H "Authorization: Bearer $T" https://kubernetes.default.svc/api/v1/namespaces/debug-lab/pods; wc -c /tmp/pods.json; head -c 160 /tmp/pods.json; echo; echo node_tls; curl -kvsI --connect-timeout 5 https://172.18.0.2:6443/ 2>&1 | tail -25'
          echo "=== REPORTER TOKEN VOLUME (metadata, not token) ==="
          kubectl -n debug-lab get pod -l app=reporter -o jsonpath='{.items[0].spec.volumes[*].name}'
          echo
      - name: End
        run: echo Finished diagnostics
