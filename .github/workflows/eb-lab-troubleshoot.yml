name: Enterprise Bot lab troubleshooting
on:
  push:
    branches: [enterprise-bot-devops-eval]
    paths: ['.github/workflows/eb-lab-troubleshoot.yml', 'lab/broken-chart/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        image: ['kindest/node:v1.29.12', 'kindest/node:v1.32.2']
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: eb-test
          node_image: ${{ matrix.image }}
      - name: Investigate with real cluster and record transcript
        run: |
          cd lab
          cat >/tmp/check.sh <<'SCRIPT'
          #!/bin/bash
          set +e
          kubectl version
          ./scenario.sh up
          for d in backend gateway worker reporter metrics; do
            kubectl -n debug-lab rollout status deployment/$d --timeout=85s
          done
          kubectl -n debug-lab wait job/migrate --for=condition=complete --timeout=85s
          echo '=== Pod state and reporter logs ==='
          kubectl -n debug-lab get deploy,pods,svc -o wide
          kubectl -n debug-lab logs deploy/reporter --tail=30
          echo '=== Independent check of Kubernetes API JSON ==='
          kubectl -n debug-lab run curl-test --image=curlimages/curl:8.17.0 --restart=Never --overrides='{"spec":{"serviceAccountName":"reporter"}}' --command -- sleep 150
          kubectl -n debug-lab wait --for=condition=Ready pod/curl-test --timeout=70s
          kubectl -n debug-lab exec curl-test -- sh -c 'T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token); curl -sk -o /tmp/pods.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $T" https://kubernetes.default.svc/api/v1/namespaces/debug-lab/pods; wc -c /tmp/pods.json'
          kubectl -n debug-lab delete pod curl-test --wait=true
          echo '=== Reporter status and original 11 checks ==='
          kubectl -n debug-lab logs deploy/reporter --tail=25
          ./scenario.sh verify
          ./scenario.sh verify
          echo '=== Original verifier shell trace ==='
          bash -x ./scenario.sh verify 2>&1 | tail -80
          SCRIPT
          script -q -f -c "bash /tmp/check.sh" part4-session.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-session-${{ strategy.job-index }}
          path: lab/part4-session.log
