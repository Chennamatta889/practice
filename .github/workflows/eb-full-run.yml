name: Enterprise Bot full cloud evaluation
on:
  push:
    branches: [enterprise-bot-devops-eval]
    paths: [".github/workflows/eb-full-run.yml", "eb-source.b64"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack actual solution from compressed source
        run: |
          base64 -d eb-source.b64 | tar -xz
          chmod +x setup.sh lab/scenario.sh
          echo "Unpacked original repository contents"
          ls -la
      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
      - name: Install kind and kubectl
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Run service tests and Helm lint
        run: |
          (cd service && python3 -m unittest -v test_app.py)
          helm lint chart
          helm lint lab/broken-chart
          helm template demo chart -n demo --set replicaCount=3 --set config.appName=ci-override --set config.version=2.5.0 >/tmp/chart-rendered.yaml
          grep -q 'ci-override' /tmp/chart-rendered.yaml
      - name: Exercise setup twice and ingress endpoint
        id: demo
        continue-on-error: true
        timeout-minutes: 22
        run: |
          set -euxo pipefail
          ./setup.sh
          ./setup.sh
          kubectl -n demo get deploy,pods,svc,ingress
          curl -fsS --retry 10 --retry-delay 3 --resolve demo.local:80:127.0.0.1 http://demo.local/
          curl -fsS --retry 10 --retry-delay 3 --resolve demo.local:80:127.0.0.1 http://demo.local/healthz
      - name: Record real Kubernetes debugging evidence
        if: always()
        timeout-minutes: 14
        run: |
          set +e
          kind get clusters | grep -qx demo || kind create cluster --name demo
          kubectl config use-context kind-demo
          cd lab
          script -q -f -c "bash -c './scenario.sh up; ./scenario.sh verify; kubectl -n debug-lab get deploy,pod,job,svc -o wide; kubectl -n debug-lab get events --sort-by=.lastTimestamp; for d in backend gateway worker reporter metrics; do echo ===DEPLOYMENT-\$d===; kubectl -n debug-lab describe deploy \$d; kubectl -n debug-lab logs deploy/\$d --all-containers --tail=100; done; kubectl auth can-i list pods -n debug-lab --as=system:serviceaccount:debug-lab:reporter' " part4-session.log
          echo "Recorded $(wc -c <part4-session.log) bytes of genuine session output"
          grep -E 'PASS|FAIL|check.s. failing|ALL GREEN' part4-session.log | tail -25 || true
          exit 0
      - name: Upload real diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-bot-cloud-evidence
          path: |
            lab/part4-session.log
            /tmp/chart-rendered.yaml
          if-no-files-found: warn
