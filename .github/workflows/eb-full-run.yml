name: Enterprise Bot full cloud evaluation
on:
  push:
    branches: [enterprise-bot-devops-eval]
    paths:
      - ".github/workflows/eb-full-run.yml"
      - "lab/**"
      - "!lab/part4-session.log"
      - "service/**"
      - "chart/**"
      - "setup.sh"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check project layout
        run: |
          chmod +x setup.sh lab/scenario.sh
          test -f README.md && test -f ANSWERS.md && test -f lab/FINDINGS.md
          test -f chart/Chart.yaml && test -f service/Dockerfile
      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
      - name: Install kind and kubectl
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Service tests and chart lint
        run: |
          (cd service && python3 -m unittest -v test_app.py)
          helm lint chart && helm lint lab/broken-chart
          helm template demo chart -n demo --set replicaCount=3 --set config.appName=ci-override --set config.version=2.5.0 >/tmp/chart-rendered.yaml
          grep -q ci-override /tmp/chart-rendered.yaml
      - name: Run setup twice and verify ingress
        timeout-minutes: 22
        run: |
          set -euxo pipefail
          ./setup.sh
          ./setup.sh
          kubectl -n demo get deploy,pods,svc,ingress
          curl -fsS --retry 10 --retry-delay 3 --resolve demo.local:80:127.0.0.1 http://demo.local/
          curl -fsS --retry 10 --retry-delay 3 --resolve demo.local:80:127.0.0.1 http://demo.local/healthz
      - name: Investigate and record Part 4 in live cluster
        timeout-minutes: 12
        run: |
          kubectl apply -f lab/cluster-state/namespace.yaml
          cd lab
          cat >/tmp/eb-lab-diagnostics.sh <<'DIAG'
          #!/usr/bin/env bash
          set +e
          echo '=== apply supplied chart + environment ==='
          ./scenario.sh up
          for d in backend gateway worker reporter metrics; do
            echo "=== waiting for deployment $d ==="
            kubectl -n debug-lab rollout status "deployment/$d" --timeout=35s
          done
          kubectl -n debug-lab wait --for=condition=complete job/migrate --timeout=35s
          echo '=== first complete verification ==='
          ./scenario.sh verify
          echo '=== pod and service snapshot ==='
          kubectl -n debug-lab get deploy,pod,job,svc -o wide
          echo '=== pod events ==='
          kubectl -n debug-lab get events --sort-by=.lastTimestamp
          echo '=== reporter authorization ==='
          kubectl auth can-i list pods -n debug-lab --as=system:serviceaccount:debug-lab:reporter
          for d in backend gateway worker reporter metrics; do
            echo "=== deployment $d ==="
            kubectl -n debug-lab describe "deployment/$d"
            echo "=== logs $d ==="
            kubectl -n debug-lab logs "deployment/$d" --all-containers --tail=80
            echo "=== prior logs $d ==="
            kubectl -n debug-lab logs "deployment/$d" --previous --all-containers --tail=25
          done
          DIAG
          script -q -f -c "bash /tmp/eb-lab-diagnostics.sh" part4-session.log
          echo '=== final verification (must pass) ==='
          ./scenario.sh verify
      - name: Upload genuine terminal recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-bot-cloud-evidence
          path: lab/part4-session.log
          if-no-files-found: warn
