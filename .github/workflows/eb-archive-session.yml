name: Commit genuine Part 4 recording
on:
  push:
    branches: [enterprise-bot-devops-eval]
    paths: [".github/workflows/eb-archive-session.yml"]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-bot-devops-eval
      - uses: actions/download-artifact@v4
        with:
          name: enterprise-bot-cloud-evidence
          repository: Chennamatta889/practice
          run-id: 44862061850
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-evidence
      - name: Commit unchanged real terminal recording
        run: |
          set -euo pipefail
          test -s original-evidence/part4-session.log
          cp original-evidence/part4-session.log lab/part4-session.log
          sha256sum lab/part4-session.log
          git config user.name "Cloud Validation Bot"
          git config user.email "validation@users.noreply.github.com"
          git add lab/part4-session.log
          git commit -m "evidence: add actual script-recorded kind debugging session"
          git push origin HEAD:enterprise-bot-devops-eval
