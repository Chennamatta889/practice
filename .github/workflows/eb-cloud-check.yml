name: Enterprise Bot cloud runner probe
on:
  push:
    branches: [enterprise-bot-devops-eval]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Docker runtime
        run: docker info && docker version
      - name: Confirm k8s utilities can run
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Verify tools
        run: kind version && kubectl version --client
